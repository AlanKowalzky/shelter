name: Deploy to GitHub Pages
on:
  push:
    branches:
      - shelter-2 # Zmiana tutaj wyzwala akcję
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          [cite_start]publish_dir: ./shelter # Zgodnie z wymaganiem: folder shelter wewnątrz repo
